<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nòmines">
  <title>Nòmines</title>
  <!--
    LA NÒMINA, EN ECOS. El full de la nòmina amb la vora de tiquet, dibuixat com
    les carenes de les germanes: la d'aquest mes davant, fosca i gruixuda, i
    darrere les dels mesos d'abans, més grans i més clares. A dins, les tres
    ratlles de tota nòmina: en turquesa el que meritues, en ocre el que et
    descompten (l'ocre del que surt, com a Finances) i en negre el líquid, que és
    el que et queda. Mateix camp pàl·lid, mateixa quadrícula, fons a sang.
  -->
  <rect width="512" height="512" fill="#e8eef0"/>
  <g stroke="#086674" stroke-width="2" opacity=".14"><path d="M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512"/></g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M88 400 L88 74 L424 74 L424 400" stroke="#bcced4" stroke-width="8"/>
    <path d="M114 400 L114 102 L398 102 L398 400" stroke="#7ab5c1" stroke-width="9"/>
    <path d="M140 400 L140 130 L372 130 L372 400" stroke="#1c8496" stroke-width="10"/>
    <path d="M166.0 414.0 L166.0 158.0 L346.0 158.0 L346.0 414.0 L328.0 386.0 L310.0 414.0 L292.0 386.0 L274.0 414.0 L256.0 386.0 L238.0 414.0 L220.0 386.0 L202.0 414.0 L184.0 386.0 L166.0 414.0 Z" stroke="#054a57" stroke-width="18"/>
    <path d="M206 218H306" stroke="#1c8496" stroke-width="12"/>
    <path d="M206 262H272" stroke="#85580f" stroke-width="12"/>
    <path d="M206 318H306" stroke="#0d191e" stroke-width="14"/>
  </g>
</svg>
