<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nòmines</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<meta name="theme-color" content="#e8eef0">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8eef0;color:#0d191e;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  main{display:grid;gap:18px;justify-items:center;max-width:340px}
  img{width:112px;height:112px}
  h1{margin:0;font-size:1.4rem;font-weight:600}
  .btn{display:inline-block;background:#054a57;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:0;border:0;font-size:1rem}
  .alt{background:transparent;color:#054a57;border:1.5px solid #054a57}
  p{margin:0;opacity:.9;font-size:.92rem}
</style>
</head>
<body>
<main>
  <img src="icona-192-v3.png" alt="">
  <h1>Les meves nòmines</h1>
  <button class="btn alt" id="install" hidden>Instal·la l'app</button>
  <p id="help">Per tenir-la com una app: menú ⋮ del Chrome → «Afegeix a la pantalla d'inici».</p>
  <a class="btn" href="https://claude.ai/artifact/H5KeS8MekvG4R6KoXLfnzJ">Obre el tauler</a>
</main>
<script>
  const TAULER = 'https://claude.ai/artifact/H5KeS8MekvG4R6KoXLfnzJ';
  // Obert des de la icona instal·lada, o des de la drecera (?app=1) un cop ja preparada: salta al tauler.
  const q = new URLSearchParams(location.search);
  let preparada = false; try { preparada = localStorage.getItem('nomines.drecera') === '1'; } catch (e) {}
  if (q.has('config')) { try { localStorage.removeItem('nomines.drecera'); } catch (e) {} preparada = false; }
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone || (q.has('app') && preparada)) location.replace(TAULER);
  else if (q.has('app')) {
    // Primera vegada amb ?app=1: és el moment de crear la drecera des d'aquesta mateixa adreça.
    try { localStorage.setItem('nomines.drecera', '1'); } catch (e) {}
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('help').innerHTML = 'Ara, des d\'aquesta pàgina: menú ⋮ del Chrome → <b>Afegeix a la pantalla d\'inici</b>. Si et pregunta, tria <b>Crea una drecera</b>.<br><br>A partir d\'ara, la icona obrirà el tauler directament.';
    });
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let prompt;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; document.getElementById('install').hidden = false; });
  document.getElementById('install').onclick = async () => { if (!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; document.getElementById('install').hidden = true; };
  addEventListener('appinstalled', () => { document.getElementById('help').textContent = 'Instal·lada! Ja la tens a la pantalla d\'inici.'; });
</script>
</body>
</html>
